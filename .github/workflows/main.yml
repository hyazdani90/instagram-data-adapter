name: Instagram Profile Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Instagram profile
        run: |
          python - <<'PY'
          import requests
          import re
          import json

          username = "shila.fastfood"

          url = f"https://www.instagram.com/{username}/"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9",
          }

          response = requests.get(
              url,
              headers=headers,
              timeout=30
          )

          print("HTTP STATUS:", response.status_code)
          print("CONTENT LENGTH:", len(response.text))

          html = response.text

          patterns = {
              "followers": r'"edge_followed_by":\{"count":(\d+)\}',
              "following": r'"edge_follow":\{"count":(\d+)\}',
              "posts": r'"edge_owner_to_timeline_media":\{"count":(\d+)',
          }

          result = {
              "username": username,
              "http_status": response.status_code
          }

          for key, pattern in patterns.items():
              match = re.search(pattern, html)
              result[key] = int(match.group(1)) if match else None

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
