name: Instagram Profile Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract Instagram Profile
        run: |
          python - <<'PY'
          import requests
          import re
          import json

          username = "shila.fastfood"
          url = f"https://www.instagram.com/{username}/"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36"
              ),
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }

          response = requests.get(
              url,
              headers=headers,
              timeout=30
          )

          print("HTTP STATUS:", response.status_code)
          print("HTML LENGTH:", len(response.text))

          html = response.text

          # --------------------------------------------------
          # Look for common Instagram embedded JSON patterns
          # --------------------------------------------------

          patterns = [
              r'<script type="application/ld\+json"[^>]*>(.*?)</script>',
              r'<script[^>]+type="application/json"[^>]*>(.*?)</script>',
              r'<script[^>]*>(.*?)</script>'
          ]

          found = []

          for pattern in patterns:
              matches = re.findall(
                  pattern,
                  html,
                  re.DOTALL | re.IGNORECASE
              )

              for item in matches:
                  text = item.strip()

                  if any(x in text for x in [
                      "followers",
                      "biography",
                      "full_name",
                      "edge_follow",
                      "is_business"
                  ]):
                      found.append(text)

          print("POTENTIAL JSON BLOCKS:", len(found))

          # --------------------------------------------------
          # Search for useful field names
          # --------------------------------------------------

          keywords = [
              "followers",
              "following",
              "biography",
              "full_name",
              "username",
              "is_business_account",
              "business_category_name",
              "media_count"
          ]

          for keyword in keywords:
              count = html.lower().count(keyword.lower())
              print(f"{keyword}: {count}")

          # --------------------------------------------------
          # Print useful snippets
          # --------------------------------------------------

          print("\n===== PROFILE DATA SNIPPETS =====\n")

          for keyword in [
              "followers",
              "biography",
              "full_name",
              "is_business_account"
          ]:

              index = html.lower().find(keyword.lower())

              if index != -1:
                  start = max(0, index - 500)
                  end = min(len(html), index + 1500)

                  print(f"\n--- {keyword} ---\n")
                  print(html[start:end])

          print("\n===== END =====")
          PY
